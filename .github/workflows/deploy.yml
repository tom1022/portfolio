name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build static export and deploy Worker
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      INFISICAL_PROJECT_ID: 59f7eabf-94e5-49d0-85ed-975dfdf27f11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Infisical CLI
        run: curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash && sudo apt-get install -y infisical

      - name: Log in to Infisical
        id: infisical_login
        run: |
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}" \
            --client-secret="${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Notify Discord on start
        env:
          INFTOK: ${{ steps.infisical_login.outputs.token }}
        run: |
          MSG=":arrow_forward: Deploy started for ${GITHUB_REPOSITORY} @ ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          infisical run --token="$INFTOK" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- \
            bash -c "curl -sS -H 'Content-Type: application/json' -X POST -d \"{\\\"content\\\": \\\"$MSG\\\"}\" \"\$PORTFOLIO_DISCORD_WEBHOOK_URL\"" || true

      - name: Build static export
        run: npm run build

      - name: Set Worker secrets and deploy
        env:
          INFTOK: ${{ steps.infisical_login.outputs.token }}
        run: |
          infisical run --token="$INFTOK" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- \
            bash -c '
              set -e
              export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_WORKERS_API_TOKEN"
              echo "$PORTFOLIO_TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
              echo "$PORTFOLIO_DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL
              npx wrangler deploy
            '

      - name: Notify Discord on success
        if: ${{ success() }}
        env:
          INFTOK: ${{ steps.infisical_login.outputs.token }}
        run: |
          MSG=":white_check_mark: Deploy succeeded for ${GITHUB_REPOSITORY} @ ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          infisical run --token="$INFTOK" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- \
            bash -c "curl -sS -H 'Content-Type: application/json' -X POST -d \"{\\\"content\\\": \\\"$MSG\\\"}\" \"\$PORTFOLIO_DISCORD_WEBHOOK_URL\"" || true

      - name: Notify Discord on failure
        if: ${{ failure() }}
        env:
          INFTOK: ${{ steps.infisical_login.outputs.token }}
        run: |
          MSG=":x: Deploy FAILED for ${GITHUB_REPOSITORY} @ ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          infisical run --token="$INFTOK" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- \
            bash -c "curl -sS -H 'Content-Type: application/json' -X POST -d \"{\\\"content\\\": \\\"$MSG\\\"}\" \"\$PORTFOLIO_DISCORD_WEBHOOK_URL\"" || true
